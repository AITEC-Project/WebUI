<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 交通違規管理系統 - 管理者後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        /* 即時地圖容器與滾動條樣式 (從 dashboard 複製過來) */
        #live-map {
            height: 350px;
            width: 100%;
            border-radius: 0.75rem;
            z-index: 1;
        }
        .leaflet-container {
            background: #0d1117 !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-[#0d1117] text-white">

<aside id="sidebar-panel" class="w-64 border-r border-gray-800 flex flex-col p-4 space-y-6 flex-shrink-0 bg-[#0d1117] transition-all duration-300">
    <div class="flex flex-col space-y-3 p-2 border-b border-gray-800 pb-4">
        <div id="sidebar-user-info" class="flex items-center space-x-3 transition-opacity duration-200 w-full relative">
            <div onclick="window.location.href='index.html';"
                 title="點擊切換至：審查人員模組"
                 class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-red-500/10 cursor-pointer hover:bg-red-500 transition-colors group">
                <i class="fas fa-user-cog text-white text-sm group-hover:scale-110 transition-transform"></i>
            </div>

            <div class="sidebar-text flex-1 min-w-0 pr-6">
                <p class="text-sm font-bold whitespace-nowrap truncate">總管理員 #0001</p>
                <p class="text-[10px] text-gray-500 whitespace-nowrap truncate">資訊管理中心 (管理人員)</p>
            </div>

            <button id="toggle-sidebar" onclick="adminApp.toggleSidebar()"
                    title="切換側邊欄狀態"
                    class="absolute right-0 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white p-1 rounded hover:bg-gray-800 transition flex-shrink-0 z-30">
                <i id="toggle-icon" class="fas fa-angle-left text-xs"></i>
            </button>
        </div>
    </div>

    <nav class="flex-1 space-y-2">
        <a href="#" onclick="adminApp.switchTab('devices')" id="menu-devices" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
            <i class="fas fa-server w-5 text-center mr-3"></i><span class="sidebar-text">設備運作管理</span>
        </a>

        <a href="#" onclick="adminApp.switchTab('dashboard')" id="menu-dashboard" class="sidebar-active flex items-center p-3 rounded-lg text-red-400">
            <i class="fas fa-chart-pie w-5 text-center mr-3"></i><span class="sidebar-text">數據儀表版</span>
        </a>

        <a href="history.html" id="menu-history" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
            <i class="fas fa-history w-5 text-center mr-3"></i><span class="sidebar-text">歷史紀錄</span>
        </a>
    </nav>

    <div class="text-xs text-green-500 flex items-center p-2">
        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse flex-shrink-0"></span>
        <span class="sidebar-text">AI Server: Online</span>
    </div>
</aside>

<main class="flex-1 flex flex-col overflow-y-auto bg-[#070a0f] p-8 custom-scrollbar">
    <header class="flex items-center justify-between border-b border-gray-800 pb-4 mb-6">
        <h1 id="admin-page-title" class="text-2xl font-bold flex items-center gap-2">
            <i class="fas fa-chart-pie text-red-500"></i> AI 交通診斷儀表板
        </h1>
    </header>

    <div id="admin-main-content">
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
