<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 交通診斷儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        #live-map { height: 350px; width: 100%; border-radius: 0.75rem; z-index: 1; }
        .leaflet-container { background: #0d1117 !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-[#0d1117] text-white">

<aside id="sidebar-panel" class="w-64 border-r border-gray-800 flex flex-col p-4 space-y-6 flex-shrink-0 bg-[#0d1117] transition-all duration-300">
    <div class="flex flex-col space-y-3 p-2 border-b border-gray-800 pb-4">
        <div id="sidebar-user-info" class="flex items-center space-x-3 transition-opacity duration-200 w-full relative">
            <div onclick="window.location.href='index.html';" title="點擊切換至：審查人員模組" class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-red-500/10 cursor-pointer hover:bg-red-500 transition-colors group">
                <i class="fas fa-user-cog text-white text-sm group-hover:scale-110 transition-transform"></i>
            </div>
            <div class="sidebar-text flex-1 min-w-0 pr-6">
                <p class="text-sm font-bold whitespace-nowrap truncate">總管理員 #0001</p>
                <p class="text-[10px] text-gray-500 whitespace-nowrap truncate">資訊管理中心 (管理人員)</p>
            </div>
            <button id="toggle-sidebar" onclick="adminApp.toggleSidebar()" class="absolute right-0 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white p-1 rounded hover:bg-gray-800 transition flex-shrink-0 z-30">
                <i id="toggle-icon" class="fas fa-angle-left text-xs"></i>
            </button>
        </div>
    </div>

    <nav class="flex-1 space-y-2">
        <a href="devices.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
            <i class="fas fa-server w-5 text-center mr-3"></i><span class="sidebar-text">設備運作管理</span>
        </a>
        <a href="admin.html" class="sidebar-active flex items-center p-3 rounded-lg text-red-400">
            <i class="fas fa-chart-pie w-5 text-center mr-3"></i><span class="sidebar-text">數據儀表版</span>
        </a>
        <a href="history.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
            <i class="fas fa-history w-5 text-center mr-3"></i><span class="sidebar-text">歷史紀錄</span>
        </a>
    </nav>
    <div class="text-xs text-green-500 flex items-center p-2">
        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse flex-shrink-0"></span><span class="sidebar-text">AI Server: Online</span>
    </div>
</aside>

<main class="flex-1 flex flex-col overflow-y-auto bg-[#070a0f] p-8 custom-scrollbar">
    <header class="flex items-center justify-between border-b border-gray-800 pb-4 mb-6">
        <h1 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-chart-pie text-red-500"></i> AI 交通診斷儀表板</h1>
    </header>

    <div id="admin-main-content">
        <section class="bg-[#0d1117] p-6 rounded-xl border-2 border-dashed border-purple-500/30 mb-8">
            <h3 class="text-md font-bold mb-4 flex items-center text-purple-400">
                <i class="fas fa-flask mr-2"></i> 路口實驗統計數據 (預留空間)
            </h3>
            <div class="h-[250px] flex items-center justify-center bg-[#070a0f] rounded-lg border border-gray-800/60">
                <div class="text-center text-gray-500">
                    <i class="fas fa-chart-network text-5xl mb-4 opacity-30"></i>
                    <p class="text-xs mt-2 opacity-70">預留給路口分析會產生的總總數據</p>
                </div>
            </div>
        </section>

        <section class="mb-10">
            <div class="flex items-center space-x-3 mb-6">
                <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>
                <h2 class="text-xl font-bold tracking-widest text-white">即時案件監控 (LIVE)</h2>
            </div>
            <div class="grid grid-cols-12 gap-8">
                <div class="col-span-12 lg:col-span-5 bg-[#0d1117] p-6 rounded-xl border border-blue-500/30 bg-blue-900/5">
                    <h3 class="text-sm font-bold text-blue-400 uppercase mb-6 flex items-center"><i class="fas fa-stream mr-2"></i> 30min 違規樣態即時排行</h3>
                    <div class="h-[350px]"><canvas id="liveFlowChart"></canvas></div>
                </div>
                <div class="col-span-12 lg:col-span-7 bg-[#0d1117] p-6 rounded-xl border border-gray-800">
                    <h3 class="text-sm font-bold text-gray-400 uppercase mb-6 flex items-center"><i class="fas fa-map-marked-alt mr-2"></i> 台中市即時違規熱點</h3>
                    <div id="live-map"></div>
                </div>
            </div>
        </section>

        <section class="mb-10">
            <div class="flex items-center space-x-3 mb-6">
                <div class="w-3 h-3 rounded-full bg-blue-500"></div><h2 class="text-xl font-bold tracking-widest text-white">案件統計數據 (已審核)</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="bg-[#0d1117] p-5 rounded-xl border border-gray-800">
                    <p class="text-gray-500 text-xs font-bold uppercase mb-2">平均案件量 (30d)</p><div id="stat-avg-rate"></div>
                </div>
                <div class="bg-[#0d1117] p-5 rounded-xl border border-gray-800">
                    <p class="text-gray-500 text-xs font-bold uppercase mb-2">平均撤銷率 (30d)</p><div id="stat-cancel-rate"></div>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-[#0d1117] p-5 rounded-xl border border-gray-800">
                    <p class="text-gray-500 text-xs font-bold uppercase mb-2 text-blue-400">路口違規量異常偵測</p><div id="stat-vol-anomaly" class="space-y-3"></div>
                </div>
                <div class="bg-[#0d1117] p-5 rounded-xl border border-gray-800">
                    <p class="text-gray-500 text-xs font-bold uppercase mb-2 text-blue-400">路口撤銷量異常偵測</p><div id="stat-cancel-anomaly" class="space-y-3"></div>
                </div>
                <div class="bg-[#0d1117] p-5 rounded-xl border border-gray-800">
                    <p class="text-gray-500 text-xs font-bold uppercase mb-2 text-blue-400">路口違規樣態異常偵測</p><div id="stat-type-anomaly" class="space-y-3"></div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-12 gap-8 mb-8">
            <div class="col-span-12 lg:col-span-7 bg-[#0d1117] p-6 rounded-xl border border-gray-800">
                <h3 class="text-lg font-bold mb-6 text-white">前五名違規熱點路口</h3><div class="h-[350px]"><canvas id="rankingChart"></canvas></div>
            </div>
            <div class="col-span-12 lg:col-span-5 bg-[#0d1117] p-6 rounded-xl border border-gray-800">
                <h3 class="text-lg font-bold mb-6 text-white">前五名違規樣態分析</h3><div class="h-[350px]"><canvas id="typePieChart"></canvas></div>
            </div>
        </div>

        <div class="bg-[#0d1117] p-6 rounded-xl border border-gray-800 mb-8">
            <h3 class="text-lg font-bold mb-6 text-white">全域 24h 違規時段分布趨勢</h3><div class="h-[250px]"><canvas id="timeHeatmap"></canvas></div>
        </div>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
