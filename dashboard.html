<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>審核人員儀表板 - AI 交通系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
  </style>
</head>
<body class="bg-[#0d1117] text-[#e6edf3] h-screen flex overflow-hidden">

<aside id="sidebar-panel" class="w-64 border-r border-gray-800 flex flex-col p-4 space-y-6 flex-shrink-0 bg-[#0d1117] transition-all duration-300 z-10">
  <div class="flex flex-col space-y-3 p-2 border-b border-gray-800 pb-4">
    <div id="sidebar-user-info" class="flex items-center space-x-3 transition-opacity duration-200 w-full relative">
      <div onclick="window.location.href='admin.html';"
           title="點擊切換至：系統管理模組"
           class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-500/10 cursor-pointer hover:bg-blue-500 transition-colors group">
        <i class="fas fa-user-shield text-white text-sm group-hover:scale-110 transition-transform"></i>
      </div>

      <div class="sidebar-text flex-1 min-w-0 pr-6">
        <p class="text-sm font-bold whitespace-nowrap truncate">警員 某韋坪 #0123</p>
        <p class="text-[10px] text-gray-500 whitespace-nowrap truncate">交通大隊 (審查人員)</p>
      </div>

      <button id="toggle-sidebar" onclick="typeof app !== 'undefined' ? app.toggleSidebar() : null"
              title="切換側邊欄狀態"
              class="absolute right-0 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white p-1 rounded hover:bg-gray-800 transition flex-shrink-0 z-30">
        <i id="toggle-icon" class="fas fa-angle-left text-xs"></i>
      </button>
    </div>
  </div>

  <nav class="flex-1 space-y-2">
    <a href="index.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
      <i class="fas fa-home w-5 text-center mr-3"></i><span class="sidebar-text">各地通報案件</span>
    </a>
    <a href="dashboard.html" class="sidebar-active flex items-center p-3 rounded-lg text-blue-400">
      <i class="fas fa-chart-line w-5 text-center mr-3"></i><span class="sidebar-text">數據儀表板</span>
    </a>
    <a href="history.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
      <i class="fas fa-history w-5 text-center mr-3"></i><span class="sidebar-text">歷史案件</span>
    </a>
  </nav>

  <div class="text-xs text-green-500 flex items-center p-2">
    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse flex-shrink-0"></span>
    <span class="sidebar-text">AI Server: Online</span>
  </div>
</aside>

<main class="flex-1 overflow-y-auto custom-scrollbar p-8">
  <header class="flex justify-between items-end mb-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">個人儀表板</h1>
    </div>
  </header>

  <section class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-8">
    <div class="card-bg p-5 rounded-xl border border-gray-800 flex flex-col justify-between">
      <p class="text-gray-500 text-xs font-bold uppercase mb-2 flex items-center"><i class="fas fa-inbox mr-2"></i>今日案件量</p>
      <div class="text-3xl font-bold text-white" id="kpi-total">0</div>
    </div>
    <div class="card-bg p-5 rounded-xl border border-gray-800 flex flex-col justify-between">
      <p class="text-yellow-500/80 text-xs font-bold uppercase mb-2 flex items-center"><i class="fas fa-hourglass-half mr-2"></i>待審核</p>
      <div class="text-3xl font-bold text-yellow-500" id="kpi-pending">0</div>
    </div>
    <div class="card-bg p-5 rounded-xl border border-gray-800 flex flex-col justify-between">
      <p class="text-green-500/80 text-xs font-bold uppercase mb-2 flex items-center"><i class="fas fa-check-circle mr-2"></i>已審核</p>
      <div class="text-3xl font-bold text-green-500" id="kpi-reviewed">0</div>
    </div>
    <div class="card-bg p-5 rounded-xl border border-blue-500/30 bg-blue-900/10 flex flex-col justify-between">
      <p class="text-blue-400 text-xs font-bold uppercase mb-2 flex items-center"><i class="fas fa-tachometer-alt mr-2"></i>審核完成率</p>
      <div class="flex items-end space-x-2">
        <div class="text-3xl font-bold text-blue-400" id="kpi-comp-rate">0%</div>
      </div>
      <div class="w-full bg-gray-800 rounded-full h-1.5 mt-3">
        <div class="bg-blue-500 h-1.5 rounded-full transition-all duration-500" id="kpi-comp-bar" style="width: 0%"></div>
      </div>
    </div>
    <div class="card-bg p-5 rounded-xl border border-red-500/30 bg-red-900/10 flex flex-col justify-between">
      <p class="text-red-400 text-xs font-bold uppercase mb-2 flex items-center"><i class="fas fa-times-circle mr-2"></i>案件撤銷率</p>
      <div class="text-3xl font-bold text-red-400" id="kpi-cancel-rate">0%</div>
    </div>
  </section>

  <section class="mb-8 card-bg p-6 rounded-xl border border-gray-800">
    <h3 class="text-lg font-bold mb-6 text-white flex items-center">
      <i class="fas fa-chart-line mr-2 text-blue-400"></i>72小時總案件分級趨勢
    </h3>
    <div class="h-[320px]">
      <canvas id="levelTrendChart"></canvas>
    </div>
  </section>

  <section class="grid grid-cols-12 gap-8 mb-8">
    <div class="col-span-12 lg:col-span-8 card-bg p-6 rounded-xl border border-gray-800">
      <h3 class="text-lg font-bold mb-6 text-white flex items-center"><i class="fas fa-chart-area mr-2 text-gray-500"></i>近 7 日個人審核量趨勢</h3>
      <div class="h-[250px]">
        <canvas id="reviewTrendChart"></canvas>
      </div>
    </div>
    <div class="col-span-12 lg:col-span-4 card-bg p-6 rounded-xl border border-gray-800">
      <h3 class="text-lg font-bold mb-6 text-white flex items-center"><i class="fas fa-chart-pie mr-2 text-gray-500"></i>今日審核結果分佈</h3>
      <div class="h-[250px]">
        <canvas id="reviewResultChart"></canvas>
      </div>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
