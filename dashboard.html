<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 交通診斷儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0d1117] text-[#e6edf3] h-screen flex overflow-hidden">

<aside class="w-64 h-screen border-r border-gray-800 flex flex-col p-4 space-y-6 flex-shrink-0 bg-[#0d1117] z-10">
  <div class="flex items-center space-x-3 p-2">
    <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center"><i class="fas fa-user text-gray-400"></i></div>
    <div>
      <p class="text-sm font-bold">警員 某韋坪 #0123</p>
      <div class="flex items-center text-[10px] text-green-500 mt-1">
        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>AI Server Online
      </div>
    </div>
  </div>
  <nav class="flex-1 space-y-2">
    <a href="index.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400"><i class="fas fa-home mr-3"></i>各地通報案件</a>
    <a href="dashboard.html" class="sidebar-active flex items-center p-3 rounded-lg text-blue-400"><i class="fas fa-chart-line mr-3"></i>數據儀表板</a>
    <a href="history.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400"><i class="fas fa-history mr-3"></i>歷史案件</a>
  </nav>
</aside>

<main class="flex-1 overflow-y-auto custom-scrollbar p-8">
  <header class="flex justify-between items-end mb-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">交通設計診斷系統</h1>
      <p class="text-gray-500 mt-2">分析路口設計缺陷與違規關聯性</p>
    </div>
    <div class="flex space-x-4">
      <select id="time-range" class="bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        <option value="24h">過去 24 小時</option>
        <option value="7d" selected>過去 7 天</option>
        <option value="30d">過去 30 天</option>
      </select>
    </div>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="card-bg p-5 rounded-xl border border-gray-800">
      <p class="text-gray-500 text-xs font-bold uppercase mb-1">總通報件數</p>
      <h3 id="stat-total" class="text-2xl font-mono font-bold">1,284</h3>
    </div>
    <div class="card-bg p-5 rounded-xl border border-gray-800">
      <p class="text-gray-500 text-xs font-bold uppercase mb-1">AI 辨識準確率</p>
      <h3 class="text-2xl font-mono font-bold text-green-400">94.2%</h3>
    </div>
    <div class="card-bg p-5 rounded-xl border border-gray-800">
      <p class="text-gray-500 text-xs font-bold uppercase mb-1">系統平均延遲</p>
      <h3 class="text-2xl font-mono font-bold text-blue-400">42ms</h3>
    </div>
    <div class="card-bg p-5 rounded-xl border border-gray-800">
      <p class="text-gray-500 text-xs font-bold uppercase mb-1">低信心值聚集地</p>
      <h3 class="text-lg font-bold text-red-400">西屯路/逢甲路</h3>
    </div>
  </div>

  <div class="mb-8">
    <h3 class="text-sm font-bold text-gray-500 uppercase mb-4 flex items-center">
      <i class="fas fa-robot mr-2 text-blue-500"></i> AI 診斷告警
    </h3>
    <div id="anomaly-alerts" class="grid grid-cols-1 gap-4">
    </div>
  </div>

  <div class="card-bg p-4 rounded-xl border border-gray-800 mb-8 flex space-x-4 items-center">
    <div class="flex-1 group">
      <label class="block text-[10px] text-gray-500 mb-1 ml-1 font-bold">分析模式</label>
      <select id="analysis-mode" class="w-full bg-transparent text-sm font-bold outline-none cursor-pointer">
        <option value="location-rank">路口排行模式 (哪些路口最常發生此違規?)</option>
        <option value="event-composition">事件組成模式 (此路段有哪些系統性違規?)</option>
      </select>
    </div>
    <div class="h-8 w-[1px] bg-gray-800"></div>
    <div class="flex-1 group">
      <label id="secondary-label" class="block text-[10px] text-gray-500 mb-1 ml-1 font-bold">篩選對象</label>
      <select id="secondary-filter" class="w-full bg-transparent text-sm font-bold outline-none cursor-pointer text-blue-400">
      </select>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-8 mb-8">
    <div class="col-span-12 lg:col-span-8 card-bg p-6 rounded-xl border border-gray-800">
      <h3 class="text-lg font-bold mb-6">趨勢與排名分析</h3>
      <div class="h-[400px]">
        <canvas id="rankingChart"></canvas>
      </div>
    </div>
    <div class="col-span-12 lg:col-span-4 card-bg p-6 rounded-xl border border-gray-800">
      <h3 class="text-lg font-bold mb-6">24h 違規熱點時段</h3>
      <div class="h-[400px]">
        <canvas id="timeHeatmap"></canvas>
      </div>
    </div>
  </div>
</main>

<script src="js/history.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
