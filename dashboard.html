<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 交通統計儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0d1117] text-[#e6edf3] h-screen flex overflow-hidden">

<aside class="w-64 h-screen border-r border-gray-800 flex flex-col p-4 space-y-6 flex-shrink-0 bg-[#0d1117] z-10">
  <div class="flex items-center space-x-3 p-2">
    <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center">
      <i class="fas fa-user text-gray-400"></i>
    </div>
    <div>
      <p class="text-sm font-bold">警員 某韋坪 #0123</p>
      <p class="text-xs text-gray-500">台中市 北屯區</p>
    </div>
  </div>

  <nav class="flex-1 space-y-2 overflow-y-auto custom-scrollbar">
    <a href="index.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
      <i class="fas fa-home mr-3"></i>各地通報案件
    </a>

    <a href="dashboard.html" class="sidebar-active flex items-center p-3 rounded-lg text-blue-400">
      <i class="fas fa-chart-line mr-3"></i>數據儀表板
    </a>

    <a href="history.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
      <i class="fas fa-history mr-3"></i>歷史案件
    </a>
  </nav>

  <div class="text-xs text-green-500 flex items-center p-2 border-t border-gray-800 pt-4">
    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span> AI Server: Online
  </div>
</aside>

<main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
  <header class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">數據儀表板</h1>
      <p class="text-gray-400 mt-1" id="analysis-desc">目前顯示：各路口違規頻率排行</p>
    </div>
    <div class="flex items-center space-x-3">
      <select id="analysis-mode" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
        <option value="location-rank">路口違規排行 (選事件)</option>
        <option value="event-rank">事件類型排行 (選路口)</option>
      </select>

      <select id="secondary-filter" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
      </select>

      <select id="time-range" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
        <option value="24h">過去 24 小時</option>
        <option value="7d" selected>過去 7 天</option>
        <option value="30d">過去 30 天</option>
      </select>
    </div>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="card-bg p-6 rounded-xl border border-gray-800">
      <p class="text-gray-500 text-xs font-bold uppercase mb-1">總通報件數</p>
      <h3 class="text-2xl font-mono font-bold">1,284</h3>
      <span class="text-green-500 text-xs mt-2 inline-block"><i class="fas fa-caret-up"></i> 12.5%</span>
    </div>
    <div class="card-bg p-6 rounded-xl border border-gray-800">
      <p class="text-gray-500 text-xs font-bold uppercase mb-1">AI 辨識準確率</p>
      <h3 class="text-2xl font-mono font-bold">94.2%</h3>
    </div>
    <div class="card-bg p-6 rounded-xl border border-gray-800">
      <p class="text-gray-500 text-xs font-bold uppercase mb-1">主要違規類型</p>
      <h3 class="text-2xl font-bold text-red-400">超速</h3>
    </div>
    <div class="card-bg p-6 rounded-xl border border-gray-800">
      <p class="text-gray-500 text-xs font-bold uppercase mb-1">系統延遲</p>
      <h3 class="text-2xl font-mono font-bold">24ms</h3>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-8">
    <div class="col-span-12 card-bg p-6 rounded-xl border border-gray-800">
      <h3 class="text-lg font-bold mb-6">熱點路口違規率排名</h3>
      <div class="h-[500px]"> <canvas id="rankingChart"></canvas>
      </div>
    </div>
  </div>
</main>

<script src="dashboard.js"></script>
</body>
</html>
