<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 交通診斷儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    /* 即時地圖容器樣式 */
    #live-map {
      height: 350px;
      width: 100%;
      border-radius: 0.75rem;
      z-index: 1;
    }
    .leaflet-container {
      background: #0d1117 !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-[#0d1117] text-[#e6edf3] h-screen flex overflow-hidden">

<aside class="w-64 h-screen border-r border-gray-800 flex flex-col p-4 space-y-6 flex-shrink-0 bg-[#0d1117] z-10">
  <div class="flex items-center space-x-3 p-2">
    <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center">
      <i class="fas fa-user text-gray-400"></i>
    </div>
    <div>
      <p class="text-sm font-bold">警員 某韋坪 #0123</p>
      <div class="flex items-center text-[10px] text-green-500 mt-1">
        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>AI Server Online
      </div>
    </div>
  </div>
  <nav class="flex-1 space-y-2">
    <a href="index.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400">
      <i class="fas fa-home mr-3"></i>各地通報案件
    </a>
    <a href="dashboard.html" class="sidebar-active flex items-center p-3 rounded-lg text-blue-400">
      <i class="fas fa-chart-line mr-3"></i>數據儀表板
    </a>
    <a href="history.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400">
      <i class="fas fa-history mr-3"></i>歷史案件
    </a>
  </nav>
</aside>

<main class="flex-1 overflow-y-auto custom-scrollbar p-8">
  <header class="flex justify-between items-end mb-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">數據儀表版</h1>
    </div>
  </header>

  <section class="mb-10">
    <div class="flex items-center space-x-3 mb-6">
      <span class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
      </span>
      <h2 class="text-xl font-bold tracking-widest">即時案件監控 (LIVE)</h2>
    </div>

    <div class="grid grid-cols-12 gap-8">
      <div class="col-span-12 lg:col-span-5 card-bg p-6 rounded-xl border border-blue-500/30 bg-blue-900/5">
        <h3 class="text-sm font-bold text-blue-400 uppercase mb-6 flex items-center">
          <i class="fas fa-stream mr-2"></i> 30min 違規樣態即時排行
        </h3>
        <div class="h-[350px]">
          <canvas id="liveFlowChart"></canvas>
        </div>
      </div>

      <div class="col-span-12 lg:col-span-7 card-bg p-6 rounded-xl border border-gray-800">
        <h3 class="text-sm font-bold text-gray-400 uppercase mb-6 flex items-center">
          <i class="fas fa-map-marked-alt mr-2"></i> 台中市即時違規熱點
        </h3>
        <div id="live-map"></div>
      </div>
    </div>
  </section>

  <section class="mb-10">
    <div class="flex items-center space-x-3 mb-6">
      <div class="w-3 h-3 rounded-full bg-blue-500"></div>
      <h2 class="text-xl font-bold tracking-widest">案件統計數據 (已審核)</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="card-bg p-5 rounded-xl border border-gray-800">
        <p class="text-gray-500 text-xs font-bold uppercase mb-2">平均案件量 (30d)</p>
        <div id="stat-avg-rate"></div>
      </div>
      <div class="card-bg p-5 rounded-xl border border-gray-800">
        <p class="text-gray-500 text-xs font-bold uppercase mb-2">平均撤銷率 (30d)</p>
        <div id="stat-cancel-rate"></div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="card-bg p-5 rounded-xl border border-gray-800">
        <p class="text-gray-500 text-xs font-bold uppercase mb-2 text-blue-400">路口違規量異常偵測</p>
        <div id="stat-vol-anomaly" class="space-y-3"></div>
      </div>
      <div class="card-bg p-5 rounded-xl border border-gray-800">
        <p class="text-gray-500 text-xs font-bold uppercase mb-2 text-blue-400">路口撤銷量異常偵測</p>
        <div id="stat-cancel-anomaly" class="space-y-3"></div>
      </div>
      <div class="card-bg p-5 rounded-xl border border-gray-800">
        <p class="text-gray-500 text-xs font-bold uppercase mb-2 text-blue-400">路口違規樣態異常偵測</p>
        <div id="stat-type-anomaly" class="space-y-3"></div>
      </div>
    </div>
  </section>

  <div class="grid grid-cols-12 gap-8 mb-8">
    <div class="col-span-12 lg:col-span-7 card-bg p-6 rounded-xl border border-gray-800">
      <h3 class="text-lg font-bold mb-6">前五名違規熱點路口</h3>
      <div class="h-[350px]">
        <canvas id="rankingChart"></canvas>
      </div>
    </div>
    <div class="col-span-12 lg:col-span-5 card-bg p-6 rounded-xl border border-gray-800">
      <h3 class="text-lg font-bold mb-6">前五名違規樣態分析</h3>
      <div class="h-[350px]">
        <canvas id="typePieChart"></canvas>
      </div>
    </div>
  </div>

  <div class="card-bg p-6 rounded-xl border border-gray-800 mb-8">
    <h3 class="text-lg font-bold mb-6">全域 24h 違規時段分布趨勢</h3>
    <div class="h-[250px]">
      <canvas id="timeHeatmap"></canvas>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/data.js"></script>
<script src="js/history.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
