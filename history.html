<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史案件紀錄 - AI 交通系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0d1117] text-[#e6edf3] h-screen flex overflow-hidden">

<aside class="w-64 h-screen border-r border-gray-800 flex flex-col p-4 space-y-6 flex-shrink-0 bg-[#0d1117] z-10">
    <div class="flex items-center space-x-3 p-2">
        <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center"><i class="fas fa-user text-gray-400"></i></div>
        <div>
            <p class="text-sm font-bold">警員 某韋坪 #0123</p>
            <p class="text-xs text-gray-500">台中市 北屯區</p>
        </div>
    </div>
    <nav class="flex-1 space-y-2 overflow-y-auto custom-scrollbar">
        <a href="index.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400">
            <i class="fas fa-home mr-3"></i>各地通報案件
        </a>
        <a href="dashboard.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400">
            <i class="fas fa-chart-line mr-3"></i>數據儀表板
        </a>
        <a href="history.html" class="sidebar-active flex items-center p-3 rounded-lg text-blue-400">
            <i class="fas fa-history mr-3"></i>歷史案件
        </a>
    </nav>
    <div class="text-xs text-green-500 flex items-center p-2 border-t border-gray-800 pt-4">
        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span> AI Server: Online
    </div>

</aside>

<main class="flex-1 flex flex-col overflow-hidden">
    <header class="p-8 border-b border-gray-800">
        <h1 class="text-3xl font-bold tracking-tight">歷史案件紀錄</h1>

        <div class="grid grid-cols-12 gap-4 mt-6">
            <div class="col-span-3">
                <label class="block text-xs text-gray-500 mb-2 uppercase font-bold">時間跨度</label>
                <select id="filter-range" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">全部時間</option>
                    <option value="today">今天</option>
                    <option value="7d">最近 7 天</option>
                    <option value="30d">最近 30 天</option>
                </select>
            </div>
            <div class="col-span-3">
                <label class="block text-xs text-gray-500 mb-2 uppercase font-bold">違規類型</label>
                <select id="filter-type" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">所有類型</option>
                    <option value="超速">超速</option>
                    <option value="闖紅燈">闖紅燈</option>
                    <option value="違規停車">違規停車</option>
                </select>
            </div>
            <div class="col-span-3">
                <label class="block text-xs text-gray-500 mb-2 uppercase font-bold">裁決狀態</label>
                <select id="filter-status" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">所有狀態</option>
                    <option value="已成立">已成立</option>
                    <option value="已撤銷">已撤銷</option>
                </select>
            </div>
            <div class="col-span-3 flex items-end">
                <button id="reset-filters" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded-lg text-sm transition font-medium">
                    重置篩選條件
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
        <div class="card-bg rounded-xl border border-gray-800 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-gray-900/50 border-b border-gray-800 text-gray-500 text-xs uppercase font-bold">
                    <th class="p-4">案號</th>
                    <th class="p-4">違規時間</th>
                    <th class="p-4">路段</th>
                    <th class="p-4">違規類型</th>
                    <th class="p-4">車牌號碼</th>
                    <th class="p-4">裁決狀態</th>
                    <th class="p-4 text-right">操作</th>
                </tr>
                </thead>
                <tbody id="history-table-body" class="text-sm">
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="data.js"></script>
<script src="history.js"></script>
</body>
</html>
