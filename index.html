<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 交通違規通報管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: {
                            400: '#5a82df',
                            500: '#3662D8',
                            600: '#3662D8',
                            700: '#284eab',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex overflow-hidden bg-gray-50">

<!-- 側邊欄 -->
<aside id="sidebar-panel" class="w-64 border-r border-gray-200 flex flex-col p-4 space-y-6 flex-shrink-0 bg-gray-50 transition-all duration-300">
    <div class="flex flex-col space-y-3 p-2 border-b border-gray-200 pb-4">
        <!-- 李執法官、直角黑底圖示 -->
        <div id="sidebar-user-info" class="flex items-center space-x-3 w-full relative">
            <!-- 左側圖示 -->
            <div class="w-11 h-11 bg-black flex items-center justify-center flex-shrink-0">
                <i class="far fa-user text-white text-xl"></i>
            </div>
            <!-- 右側文字 -->
            <div class="sidebar-text flex-1 min-w-0 pr-6">
                <p class="text-base font-bold whitespace-nowrap text-[#1a2332] tracking-wide">林警官</p>
                <p class="text-xs text-gray-500 whitespace-nowrap mt-0.5">交通分隊一組</p>
            </div>
            <!-- 縮放按鈕 -->
            <button id="toggle-sidebar" onclick="app.toggleSidebar()" class="absolute right-0 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700 p-1">
                <i id="toggle-icon" class="fas fa-angle-left text-xs"></i>
            </button>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar pr-2">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 pl-2 flex items-center gap-2">
            <i class="fas fa-check-shield"></i> 審查模式
        </p>
        <nav class="space-y-1 mb-6">
            <a href="index.html" class="sidebar-active flex items-center p-3 font-medium shadow-sm" onclick="app.filterCases('all', this)">
                <i class="fas fa-check-square w-5 text-center mr-3"></i><span class="sidebar-text">案件審核</span>
            </a>
            <a href="dashboard.html" class="flex items-center p-3 text-gray-600 hover:bg-gray-100 transition font-medium">
                <i class="fas fa-users w-5 text-center mr-3"></i><span class="sidebar-text">審核人員統計</span>
            </a>
            <a href="history.html" class="flex items-center p-3 text-gray-600 hover:bg-gray-100 transition font-medium">
                <i class="fas fa-history w-5 text-center mr-3"></i><span class="sidebar-text">歷史案件</span>
            </a>
        </nav>

        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 pl-2 flex items-center gap-2">
            觀測模式
        </p>
        <nav class="space-y-1">
            <a href="admin.html" class="flex items-center p-3 text-gray-600 hover:bg-gray-100 transition font-medium">
                <i class="fas fa-border-all w-5 text-center mr-3"></i><span class="sidebar-text">數據監測中心</span>
            </a>
            <a href="#" class="flex items-center p-3 text-gray-600 hover:bg-gray-100 transition font-medium">
                <i class="fas fa-chart-line w-5 text-center mr-3"></i><span class="sidebar-text">趨勢預測分析</span>
            </a>
            <a href="#" class="flex items-center p-3 text-gray-600 hover:bg-gray-100 transition font-medium">
                <i class="fas fa-clipboard-list w-5 text-center mr-3"></i><span class="sidebar-text">監測紀錄</span>
            </a>
        </nav>
    </div>
</aside>

<!-- 中間列表區塊 -->
<section class="w-[340px] border-r border-gray-200 flex flex-col flex-shrink-0 bg-gray-50">
    <div class="p-6 pb-2">
        <!-- 搜尋列 -->
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="keyword-search" oninput="app.applyFilters()" class="w-full bg-gray-200 border-transparent py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition text-gray-700 placeholder-gray-400 font-medium" placeholder="搜尋案件編號或路段...">
        </div>

        <!-- 按鈕切換篩選器 -->
        <div class="mb-4">
            <div class="flex justify-between items-center text-xs text-gray-400 font-bold uppercase tracking-widest mb-3">
                <span>分級篩選</span>
                <i class="fas fa-sliders-h cursor-pointer hover:text-gray-600" onclick="app.toggleFilterPanel()"></i>
            </div>

            <!-- 按鈕切換篩選器 -->
            <div class="flex bg-gray-200 p-1 text-center font-bold text-xs shadow-inner">
                <button class="filter-btn flex-1 py-2 text-red-600 bg-red-50 border border-red-100 shadow-sm transition-all" onclick="app.filterCases('high', this)">
                    <div class="text-[10px] mb-0.5 opacity-80">確信違規</div>
                    <div class="text-xl font-extrabold" id="high-confidence-count">0</div>
                </button>
                <button class="filter-btn flex-1 py-2 text-gray-400 border border-transparent transition-all hover:text-gray-600" onclick="app.filterCases('mid', this)">
                    <div class="text-[10px] mb-0.5 opacity-80">疑似違規</div>
                    <div class="text-xl font-extrabold" id="mid-confidence-count">0</div>
                </button>
                <button class="filter-btn flex-1 py-2 text-gray-400 border border-transparent transition-all hover:text-gray-600" onclick="app.filterCases('low', this)">
                    <div class="text-[10px] mb-0.5 opacity-80">邊界案例</div>
                    <div class="text-xl font-extrabold" id="low-confidence-count">0</div>
                </button>
            </div>
        </div>
    </div>

    <div id="category-notch" class="transition-all duration-300"></div>
    <div id="case-list" class="flex-1 overflow-y-auto px-6 py-2 space-y-4 custom-scrollbar pb-6">
        <!-- JS動態生成案件卡片 -->
    </div>
</section>

<!-- 右側詳細視圖 -->
<section class="flex-1 flex flex-col w-full bg-white relative overflow-hidden">
    <div id="detail-scroll-area" class="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-10 bg-white w-full">
        <header class="mb-8" id="detail-header"></header>
        <div class="space-y-6 w-full max-w-full mx-auto">
            <div id="evidence-grid" class="w-full"></div>
            <div id="analysis-container" class="w-full"></div>
        </div>
    </div>

    <footer class="shrink-0 p-5 px-10 border-t border-gray-200 flex justify-between items-center bg-white z-10">
        <!-- 修改此處：將撤銷案件按鈕改為灰色系[cite: 7] -->
        <button onclick="app.cancelCase()" class="group flex items-center text-gray-500 hover:text-gray-800 hover:bg-gray-100 px-6 py-2.5 font-bold transition border border-transparent hover:border-gray-300">
            <span>撤銷案件</span>
            <span class="ml-2 bg-gray-100 text-[10px] px-2 py-0.5 border border-gray-200 text-gray-500 group-hover:bg-gray-200 group-hover:border-gray-300 group-hover:text-gray-700 transition">Del</span>
        </button>

        <button onclick="app.openTicket()" class="relative flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 font-bold transition shadow-lg shadow-blue-600/20 group">
            <span>案件成立</span>
            <span class="ml-3 bg-white/20 text-[10px] px-2 py-0.5 border border-white/30 transition">Enter</span>
        </button>
    </footer>
</section>

<!-- 撤銷燈箱與 Modal -->
<div id="lightbox" class="fixed inset-0 bg-black/90 z-[9999] hidden flex items-center justify-center p-4 cursor-pointer is-modal">
    <img id="lightbox-img" src="" alt="違規影像燈箱檢視" class="max-w-full max-h-full shadow-2xl transition-transform duration-300">
    <div class="absolute top-5 right-8 text-white/50 text-2xl hover:text-white"><i class="fas fa-times"></i></div>
</div>

<div id="cancel-modal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[9999] hidden flex items-center justify-center p-4 transition-opacity duration-300 is-modal">
    <div class="bg-white border border-gray-200 shadow-2xl w-full max-w-md p-6 transform transition-transform scale-95 md:scale-100">
        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
            <i class="fas fa-exclamation-triangle text-gray-500 mr-2"></i>確認撤銷案件
        </h3>
        <div class="space-y-3 mb-6">
            <label class="flex items-center justify-between cursor-pointer p-3 border border-gray-200 hover:bg-gray-50 hover:border-gray-300 transition group">
                <div class="flex items-center space-x-3">
                    <input type="radio" name="cancel-reason" value="車牌模糊無法辨識" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-600">
                    <span class="text-gray-700 font-medium">車牌模糊無法辨識</span>
                </div>
                <kbd class="px-2 py-1 text-[10px] font-mono font-bold text-gray-400 bg-gray-100 border border-gray-200">1</kbd>
            </label>
            <label class="flex items-center justify-between cursor-pointer p-3 border border-gray-200 hover:bg-gray-50 hover:border-gray-300 transition group">
                <div class="flex items-center space-x-3">
                    <input type="radio" name="cancel-reason" value="未達明顯違規標準" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-600">
                    <span class="text-gray-700 font-medium">未達明顯違規標準</span>
                </div>
                <kbd class="px-2 py-1 text-[10px] font-mono font-bold text-gray-400 bg-gray-100 border border-gray-200">2</kbd>
            </label>
            <label class="flex items-center justify-between cursor-pointer p-3 border border-gray-200 hover:bg-gray-50 hover:border-gray-300 transition group">
                <div class="flex items-center space-x-3">
                    <input type="radio" name="cancel-reason" value="系統誤判(非目標車輛)" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-600">
                    <span class="text-gray-700 font-medium">系統誤判 (非目標車輛)</span>
                </div>
                <kbd class="px-2 py-1 text-[10px] font-mono font-bold text-gray-400 bg-gray-100 border border-gray-200">3</kbd>
            </label>
            <label class="flex items-center justify-between cursor-pointer p-3 border border-gray-200 hover:bg-gray-50 hover:border-gray-300 transition group">
                <div class="flex items-center space-x-3 w-full">
                    <input type="radio" name="cancel-reason" value="other" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-600" onchange="document.getElementById('other-reason-input').focus()">
                    <span class="text-gray-700 font-medium whitespace-nowrap">其他</span>
                    <input type="text" id="other-reason-input" class="flex-1 bg-gray-100 border-transparent py-1.5 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" placeholder="輸入具體原因..." onclick="document.querySelector('input[value=\'other\']').checked = true">
                </div>
                <kbd class="px-2 py-1 text-[10px] font-mono font-bold text-gray-400 bg-gray-100 border border-gray-200 ml-3">4</kbd>
            </label>
        </div>
        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
            <button onclick="app.closeCancelModal()" class="px-4 py-2 text-gray-500 hover:text-gray-800 hover:bg-gray-100 transition font-bold">取消</button>
            <button onclick="app.confirmCancelCase()" class="px-6 py-2 bg-gray-700 hover:bg-gray-800 text-white transition shadow-lg shadow-gray-700/20 font-bold flex items-center">
                確認撤銷
            </button>
        </div>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/ticketModel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
