<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 交通違規通報管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex overflow-hidden">

<aside class="w-64 border-r border-gray-800 flex flex-col p-4 space-y-6 flex-shrink-0 bg-[#0d1117]">
    <div class="flex items-center space-x-3 p-2">
        <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center">
            <i class="fas fa-user text-gray-400"></i>
        </div>
        <div>
            <p class="text-sm font-bold">警員 某韋坪 #0123</p>
            <p class="text-xs text-gray-500">台中市 北屯區</p>
        </div>
    </div>

    <nav class="flex-1 space-y-2">
        <a href="#" id="nav-all" class="sidebar-active flex items-center justify-between p-3 rounded-lg text-blue-400" onclick="app.filterCases('all', this)">
            <span><i class="fas fa-home mr-3"></i>各地通報案件</span>
            <span id="total-cases-count" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </a>

        <div class="pl-8 space-y-1 text-sm text-gray-500">
            <p class="filter-item flex items-center hover:text-white cursor-pointer transition p-2 rounded-lg" onclick="app.filterCases('high', this)">
                <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                確信違規 (<span id="high-confidence-count">0</span>)
            </p>
            <p class="filter-item flex items-center hover:text-white cursor-pointer transition p-2 rounded-lg" onclick="app.filterCases('mid', this)">
                <span class="w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>
                疑似違規 (<span id="mid-confidence-count">0</span>)
            </p>
            <p class="filter-item flex items-center hover:text-white cursor-pointer transition p-2 rounded-lg" onclick="app.filterCases('low', this)">
                <span class="w-2 h-2 bg-red-500 rounded-full mr-2"></span>
                邊界案例 (<span id="low-confidence-count">0</span>)
            </p>
        </div>

        <a href="dashboard.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
            <i class="fas fa-chart-line mr-3"></i>數據儀表板
        </a>
        <a href="history.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
            <i class="fas fa-file-alt mr-3"></i>歷史案件
        </a>
    </nav>

    <div class="text-xs text-green-500 flex items-center p-2">
        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span> AI Server: Online
    </div>
</aside>

<section class="w-[380px] border-r border-gray-800 flex flex-col flex-shrink-0 bg-black/10">
    <div class="p-4 border-b border-gray-800">
        <div class="flex items-stretch gap-2">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                <input type="text" id="keyword-search" aria-label="搜尋案號或車牌" oninput="app.applyFilters()" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-blue-500" placeholder="搜尋案號、車牌...">
            </div>
            <div class="relative">
                <button onclick="app.toggleFilterPanel()" class="h-full bg-gray-800 hover:bg-gray-700 text-gray-300 px-3.5 rounded-lg border border-gray-700 transition flex items-center justify-center">
                    <i class="fas fa-sliders text-sm"></i>
                </button>

                <div id="filter-panel" class="hidden absolute right-0 mt-2 w-72 bg-[#1c2128] border border-gray-700 rounded-xl shadow-2xl z-50 p-4 space-y-4">
                    <div>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">違規樣態</p>
                        <div class="grid grid-cols-1 gap-2 text-xs">
                            <label class="flex items-center space-x-2 cursor-pointer hover:text-blue-400">
                                <input type="checkbox" value="超速" onchange="app.applyFilters()" class="filter-type rounded border-gray-700 bg-gray-900 text-blue-600">
                                <span>超速行駛</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer hover:text-blue-400">
                                <input type="checkbox" value="闖紅燈" onchange="app.applyFilters()" class="filter-type rounded border-gray-700 bg-gray-900 text-blue-600">
                                <span>闖紅燈</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer hover:text-blue-400">
                                <input type="checkbox" value="違規停車" onchange="app.applyFilters()" class="filter-type rounded border-gray-700 bg-gray-900 text-blue-600">
                                <span>違規停車</span>
                            </label>
                        </div>
                    </div>
                    <div class="border-t border-gray-800 pt-3">
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">路段篩選</p>
                        <div class="grid grid-cols-1 gap-2 text-xs">
                            <label class="flex items-center space-x-2 cursor-pointer hover:text-blue-400">
                                <input type="checkbox" value="環中路" onchange="app.applyFilters()" class="filter-location rounded border-gray-700 bg-gray-900 text-blue-600">
                                <span>環中路</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer hover:text-blue-400">
                                <input type="checkbox" value="黎明路" onchange="app.applyFilters()" class="filter-location rounded border-gray-700 bg-gray-900 text-blue-600">
                                <span>黎明路</span>
                            </label>
                        </div>
                    </div>
                    <button onclick="app.resetFilters()" class="w-full py-1.5 bg-gray-800 hover:bg-red-900/30 text-red-400 text-[10px] rounded transition font-bold uppercase">重設篩選</button>
                </div>
            </div>
        </div>
    </div>
    <div id="case-list" class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
    </div>
</section>

<section class="flex-1 flex flex-col overflow-y-auto custom-scrollbar p-8 min-w-[600px] bg-[#0d1117]">
    <header class="mb-8" id="detail-header">
    </header>

    <div class="space-y-6">
        <div id="evidence-grid">
        </div>

        <div id="analysis-container">
            <ul id="ai-report-list" class="hidden"></ul>
        </div>
    </div>

    <footer class="mt-12 pt-6 border-t border-gray-800 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <select aria-label="撤銷理由" class="bg-gray-800 border border-gray-700 text-sm rounded-lg px-4 py-2 text-gray-300 outline-none focus:border-blue-500 transition">
                <option>請選擇撤銷理由...</option>
                <option>未明顯違規</option>
                <option>緊急車輛執行勤務</option>
                <option>影像模糊無法辨識</option>
            </select>
            <button class="text-red-400 hover:bg-red-900/30 px-6 py-2 rounded-lg font-medium transition">撤銷案件</button>
        </div>
        <button onclick="app.openTicket()" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded-xl font-bold transition shadow-lg shadow-blue-900/40">
            案件成立 & 寄送通知
        </button>
    </footer>
</section>

<div id="lightbox" class="fixed inset-0 bg-black/95 z-[9999] hidden flex items-center justify-center p-4 cursor-pointer">
    <img id="lightbox-img" src="" alt="違規影像燈箱檢視" class="max-w-full max-h-full rounded shadow-2xl transition-transform duration-300">
    <div class="absolute top-5 right-8 text-white/50 text-2xl hover:text-white"><i class="fas fa-times"></i></div>
</div>

<script src="js/data.js"></script>
<script src="js/ticketModel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
