<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 交通違規通報管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex overflow-hidden">

<aside class="w-64 border-r border-gray-800 flex flex-col p-4 space-y-6">
    <div class="flex items-center space-x-3 p-2">
        <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center">
            <i class="fas fa-user text-gray-400"></i>
        </div>
        <div>
            <p class="text-sm font-bold">警員 某韋坪 #0123</p>
            <p class="text-xs text-gray-500">台中市 北屯區</p>
        </div>
    </div>

    <nav class="flex-1 space-y-2">
        <a href="#" class="sidebar-active flex items-center justify-between p-3 rounded-lg text-blue-400">
            <span><i class="fas fa-home mr-3"></i>各地通報案件</span>
            <span class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">142</span>
        </a>
        <div class="pl-8 space-y-2 text-sm text-gray-500">
            <p class="flex items-center hover:text-white cursor-pointer"><span class="w-2 h-2 bg-red-500 rounded-full mr-2"></span>確信違規 (80)</p>
            <p class="flex items-center hover:text-white cursor-pointer"><span class="w-2 h-2 bg-orange-500 rounded-full mr-2"></span>疑似違規 (42)</p>
            <p class="flex items-center hover:text-white cursor-pointer"><span class="w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>邊界案例 (20)</p>
        </div>
        <a href="dashboard.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
            <i class="fas fa-chart-line mr-3"></i>數據儀表板
        </a>
        <a href="history.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
            <i class="fas fa-file-alt mr-3"></i>歷史案件
        </a>
    </nav>

    <div class="text-xs text-green-500 flex items-center p-2">
        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span> AI Server: Online
    </div>
</aside>

<main class="w-96 border-r border-gray-800 flex flex-col">
    <div class="p-4 border-b border-gray-800">
        <div class="relative">
            <i class="fas fa-search absolute left-3 top-3 text-gray-500"></i>
            <input type="text" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-blue-500" placeholder="搜尋案號、車牌...">
        </div>
        <div class="flex gap-2 mt-4 overflow-x-auto no-scrollbar">
            <button class="bg-blue-600 px-4 py-1 rounded-full text-xs shrink-0">全部</button>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-1 rounded-full text-xs shrink-0 transition">常率超速</button>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-1 rounded-full text-xs shrink-0 transition">闖紅燈</button>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-1 rounded-full text-xs shrink-0 transition">違規停車</button>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3" id="case-list">
    </div>
</main>

<section class="flex-1 flex flex-col overflow-y-auto custom-scrollbar p-8">
    <header class="flex justify-between items-center mb-8">
        <div>
            <h2 class="text-2xl font-bold tracking-tight">Case #AA-0000</h2>
            <p class="text-gray-400 mt-1">違規事項：超速 (限速 45, 實測 65)</p>
        </div>
        <div class="flex space-x-6 text-gray-400">
            <button class="hover:text-blue-400 transition"><i class="fas fa-print fa-lg"></i></button>
            <button class="hover:text-blue-400 transition"><i class="fas fa-external-link-alt fa-lg"></i></button>
            <button class="hover:text-blue-400 transition"><i class="fas fa-ellipsis-v fa-lg"></i></button>
        </div>
    </header>

    <div class="space-y-6">
        <div class="card-bg p-5 rounded-2xl border border-gray-800 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                    <span class="text-blue-400 font-semibold flex items-center">
                        <i class="fas fa-camera mr-2"></i> 違規當下影像
                    </span>
                <span class="text-xs text-gray-500 font-mono">TIMESTAMP: 2026-04-08 23:12:05</span>
            </div>
            <div class="relative rounded-xl overflow-hidden bg-black aspect-video group">
                <img src="https://images.unsplash.com/photo-1544365558-35aa4afcf11f?auto=format&fit=crop&q=80&w=1200" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition" alt="Evidence">
                <div class="detection-box" style="top: 40%; left: 55%; width: 25%; height: 35%;"></div>
            </div>
        </div>

        <div class="card-bg p-5 rounded-2xl border border-gray-800 shadow-xl">
    <span class="text-blue-400 font-semibold flex items-center mb-4">
        <i class="fas fa-brain mr-2"></i> AI 影像 & 法律條文分析
    </span>
            <div class="bg-black/30 p-5 rounded-xl border border-gray-800/50 leading-relaxed">
                <div class="flex items-center text-purple-400 font-bold mb-3">
                    <i class="fas fa-wand-magic-sparkles mr-2"></i> Qwen-VL 分析報告
                </div>
                <ul id="ai-report-list" class="space-y-4 text-gray-300 text-sm">
                </ul>
            </div>
        </div>
    </div>

    <footer class="mt-12 pt-6 border-t border-gray-800 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <select class="bg-gray-800 border border-gray-700 text-sm rounded-lg px-4 py-2 text-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition">
                <option>請選擇撤銷理由...</option>
                <option>救護車執行勤務</option>
                <option>影像模糊無法辨識</option>
                <option>現場員警指揮</option>
            </select>
            <button class="text-red-400 hover:bg-red-900/30 px-6 py-2 rounded-lg font-medium transition">撤銷案件</button>
        </div>
        <button class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-3 rounded-xl font-bold transition shadow-lg shadow-blue-900/40 transform hover:-translate-y-0.5">
            案件成立 & 寄送通知
        </button>
    </footer>
</section>

<script src="app.js"></script>
</body>
</html>
