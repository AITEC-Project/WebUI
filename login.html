<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - AI 交通違規管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex items-center justify-center bg-gray-100">
<div class="bg-white p-8 rounded-lg shadow-md w-96">
  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-gray-800">警用違規審核系統</h1>
    <p class="text-sm text-gray-500 mt-2">請輸入您的執法人員憑證</p>
  </div>

  <form id="login-form" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">帳號</label>
      <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">密碼</label>
      <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
    </div>
    <p id="error-msg" class="text-red-500 text-sm hidden"></p>
    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
      登入系統
    </button>
  </form>
</div>

<!-- 登入邏輯 -->
<script type="module">
  import { auth, signInWithEmailAndPassword } from "./js/firebase-config.js";

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');

    try {
      // 向 Firebase 發起登入請求
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "index.html"; // 登入成功，跳轉到主畫面
    } catch (error) {
      errorMsg.innerText = "登入失敗：帳號或密碼錯誤";
      errorMsg.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
