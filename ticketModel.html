<div id="ticket-modal" class="fixed inset-0 bg-black/90 z-[10000] hidden flex items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-[#161b22] text-[#e6edf3] w-full max-w-5xl max-h-[90vh] rounded-2xl overflow-hidden flex flex-col shadow-2xl border border-gray-800">

        <div class="bg-[#1a2a4e] border-b border-blue-500/30 p-5 flex justify-between items-center shadow-lg">
            <div class="flex items-center space-x-4">
                <div class="bg-blue-500/20 p-2 rounded-lg border border-blue-500/40">
                    <i class="fas fa-file-invoice text-blue-400 text-xl"></i>
                </div>
                <div>
                    <h3 class="text-lg font-black text-white tracking-widest uppercase">交通違規舉發預覽</h3>
                </div>
            </div>
            <button onclick="app.closeTicket()" class="text-gray-400 hover:text-white hover:bg-white/10 w-10 h-10 rounded-full transition flex items-center justify-center">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div class="grid grid-cols-12 gap-10">

                <div class="col-span-7 space-y-8">
                    <section class="space-y-4">
                        <h4 class="text-[11px] text-blue-500 font-bold uppercase tracking-[0.2em] flex items-center">
                            <span class="w-1 h-3 bg-blue-500 mr-2 rounded-full"></span> 基礎登記資訊
                        </h4>
                        <div class="grid grid-cols-2 gap-x-10 gap-y-5 bg-white/5 p-6 rounded-2xl border border-white/5">
                            <div>
                                <p class="text-[10px] text-gray-500 font-bold tracking-widest mb-1">違規單號</p>
                                <p class="font-mono font-bold text-lg text-blue-400" id="m-id">--</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-500 font-bold tracking-widest mb-1">被通知人 (車主)</p>
                                <p class="font-bold text-gray-100 text-lg">張○明</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-500 font-bold tracking-widest mb-1">舉發車牌</p>
                                <p class="font-black text-2xl text-white tracking-wider" id="m-plate">--</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-500 font-bold tracking-widest mb-1">車輛種類</p>
                                <p class="text-gray-200 font-bold" id="m-body">--</p>
                            </div>
                            <div class="col-span-2 pt-2 border-t border-white/5">
                                <p class="text-[10px] text-gray-500 font-bold tracking-widest mb-1">車主通訊地址</p>
                                <p class="text-gray-300 text-sm leading-relaxed italic">台中市西屯區台灣大道三段 99 號 (系統自動索引)</p>
                            </div>
                        </div>
                    </section>

                    <section class="space-y-4">
                        <h4 class="text-[11px] text-blue-500 font-bold uppercase tracking-[0.2em] flex items-center">
                            <span class="w-1 h-3 bg-blue-500 mr-2 rounded-full"></span> 違規事實詳情
                        </h4>
                        <div class="bg-black/40 p-6 rounded-2xl border border-gray-800 space-y-4 shadow-inner">

                            <div class="flex items-center border-b border-gray-800 pb-3">
                                <span class="text-gray-500 text-sm shrink-0">違規發生時間</span>
                                <div class="flex-grow"></div> <span class="text-gray-100 font-mono font-semibold" id="m-time">--</span>
                            </div>

                            <div class="flex items-center border-b border-gray-800 pb-3">
                                <span class="text-gray-500 text-sm shrink-0">舉發路段地點</span>
                                <div class="flex-grow"></div> <span class="text-gray-100 font-semibold text-right" id="m-location">--</span>
                            </div>

                            <div class="flex items-start border-b border-gray-800 pb-3">
                                <span class="text-gray-500 text-sm shrink-0 mt-0.5">違規行為敘述</span>
                                <div class="flex-grow"></div> <span class="text-gray-100 font-semibold text-right max-w-[60%]" id="m-type">--</span>
                            </div>

                            <div class="flex items-start border-b border-gray-800 pb-3">
                                <span class="text-gray-500 text-sm shrink-0 mt-0.5">法規條文</span>
                                <div class="flex-grow"></div> <span class="text-gray-400 text-xs text-right max-w-[70%] italic leading-relaxed" id="m-legal">--</span>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="col-span-5 flex flex-col space-y-6">
                    <section class="flex-1 space-y-4">
                        <h4 class="text-[11px] text-gray-500 font-bold uppercase tracking-[0.2em] flex items-center">
                            <i class="fas fa-camera-retro mr-2"></i> 執法採證影像
                        </h4>

                        <div class="grid grid-cols-1 gap-4" id="m-images"></div>

                        <video id="m-video" class="w-full aspect-video object-cover rounded border border-gray-200 shadow-sm hidden mt-2" controls></video>

                        <div class="bg-gradient-to-br from-blue-600/20 to-blue-900/40 p-6 rounded-3xl border border-blue-500/40 shadow-xl space-y-4">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-[10px] text-blue-400 font-black uppercase tracking-[0.2em] mb-1">應到案日期</p>
                                    <p class="text-2xl font-black text-white font-mono" id="m-deadline">--</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] text-blue-400 font-black uppercase tracking-[0.2em] mb-1">罰鍰總額</p>
                                    <div class="flex items-baseline justify-end text-blue-400">
                                        <span class="text-sm mr-1 font-bold">TWD</span>
                                        <span class="text-4xl font-black tracking-tighter text-white" id="m-fine">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="pt-4 border-t border-white/10 flex justify-between items-center">
                                <p class="text-[9px] text-gray-500 italic">經辦人：台中市第一分局葉警員</p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>

        <div class="bg-[#0d1117] p-6 border-t border-gray-800 flex justify-end items-center space-x-6">
            <div class="flex space-x-3">
                <button onclick="app.closeTicket()" class="px-6 py-3 text-sm text-gray-400 hover:text-white transition font-bold uppercase tracking-widest hover:bg-white/5 rounded-xl">
                    取消
                </button>
                <button onclick="app.confirmTicket()" class="px-10 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-black text-sm transition shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] active:scale-95 flex items-center">
                    確認舉發並寄送 <i class="fas fa-paper-plane ml-2 text-xs"></i>
                </button>
            </div>
        </div>
    </div>
</div>
